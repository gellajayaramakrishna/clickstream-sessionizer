[package]
name = "shopping-sessions"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1.12.2"
libc = "0.2.191"
memchr = "2.8.3"
memmap2 = "0.9.12"
parquet = { version = "54", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
